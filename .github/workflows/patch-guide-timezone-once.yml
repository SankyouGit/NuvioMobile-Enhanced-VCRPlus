name: Patch Guide Timezone Once

on:
  push:
    branches:
      - feature/favorites-epg-grid
    paths:
      - '.github/workflows/patch-guide-timezone-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/favorites-epg-grid

      - name: Format guide times in device local zone
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt')
          text = repo.read_text()
          old = '''internal expect object LiveTvClock {\n    fun nowEpochMs(): Long\n    fun parseXmlTvTimestamp(value: String): Long?\n}\n'''
          new = '''internal expect object LiveTvClock {\n    fun nowEpochMs(): Long\n    fun formatLocalTime(epochMs: Long): String\n    fun parseXmlTvTimestamp(value: String): Long?\n}\n'''
          assert old in text
          repo.write_text(text.replace(old, new, 1))

          android = Path('composeApp/src/androidMain/kotlin/com/nuvio/app/features/livetv/LiveTvClock.android.kt')
          text = android.read_text()
          text = text.replace('import java.time.LocalDateTime\n', 'import java.time.Instant\nimport java.time.LocalDateTime\n', 1)
          old = '    actual fun nowEpochMs(): Long = System.currentTimeMillis()\n\n'
          new = '''    actual fun nowEpochMs(): Long = System.currentTimeMillis()\n\n    actual fun formatLocalTime(epochMs: Long): String =\n        Instant.ofEpochMilli(epochMs)\n            .atZone(ZoneId.systemDefault())\n            .format(DateTimeFormatter.ofPattern("HH:mm"))\n\n'''
          assert old in text
          android.write_text(text.replace(old, new, 1))

          ios = Path('composeApp/src/iosMain/kotlin/com/nuvio/app/features/livetv/LiveTvClock.ios.kt')
          text = ios.read_text()
          old = '    actual fun nowEpochMs(): Long = (NSDate().timeIntervalSince1970 * 1000.0).toLong()\n\n'
          new = '''    actual fun nowEpochMs(): Long = (NSDate().timeIntervalSince1970 * 1000.0).toLong()\n\n    actual fun formatLocalTime(epochMs: Long): String =\n        NSDateFormatter().apply {\n            locale = NSLocale.localeWithLocaleIdentifier("en_US_POSIX")\n            dateFormat = "HH:mm"\n        }.stringFromDate(NSDate(timeIntervalSince1970 = epochMs / 1000.0))\n\n'''
          assert old in text
          ios.write_text(text.replace(old, new, 1))

          guide = Path('composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvGuide.kt')
          text = guide.read_text()
          text = text.replace('''    val referenceProgramme = remember(favoriteProgrammes) {\n        favoriteProgrammes.minByOrNull(LiveTvProgramme::startEpochMs)\n    }\n''', '', 1)
          text = text.replace('''                    referenceProgramme = referenceProgramme,\n''', '', 1)
          text = text.replace('''    referenceProgramme: LiveTvProgramme?,\n''', '', 1)
          text = text.replace('''                    referenceProgramme = referenceProgramme,\n''', '', 1)
          old_header = '''private fun GuideTimeHeader(\n    pageStartEpochMs: Long,\n    referenceProgramme: LiveTvProgramme?,\n) {'''
          if old_header in text:
              text = text.replace(old_header, '''private fun GuideTimeHeader(\n    pageStartEpochMs: Long,\n) {''', 1)
          old_label = '''                    text = guideClockLabel(\n                        epochMs = pageStartEpochMs + (hourIndex * GUIDE_HOUR_MS),\n                        referenceProgramme = referenceProgramme,\n                    ),'''
          new_label = '''                    text = LiveTvClock.formatLocalTime(\n                        pageStartEpochMs + (hourIndex * GUIDE_HOUR_MS),\n                    ),'''
          assert old_label in text
          text = text.replace(old_label, new_label, 1)
          old_program_time = '                            text = programme.timeLabel,\n'
          new_program_time = '''                            text = "${LiveTvClock.formatLocalTime(programme.startEpochMs)} - " +\n                                LiveTvClock.formatLocalTime(programme.stopEpochMs),\n'''
          assert old_program_time in text
          text = text.replace(old_program_time, new_program_time, 1)
          helper = '\nprivate fun guideClockLabel(\n'
          assert helper in text
          text = text.split(helper, 1)[0].rstrip() + '\n'
          guide.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt composeApp/src/androidMain/kotlin/com/nuvio/app/features/livetv/LiveTvClock.android.kt composeApp/src/iosMain/kotlin/com/nuvio/app/features/livetv/LiveTvClock.ios.kt composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvGuide.kt
          git commit -m 'fix: format TV guide in device local time'
          git push origin HEAD:feature/favorites-epg-grid
