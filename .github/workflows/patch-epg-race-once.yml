name: Patch EPG Race Once

on:
  push:
    branches:
      - feature/favorites-epg-grid
    paths:
      - '.github/workflows/patch-epg-race-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/favorites-epg-grid

      - name: Patch EPG request cancellation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt')
          text = path.read_text()

          old_import = 'import kotlinx.coroutines.Dispatchers\n'
          new_import = 'import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.Job\nimport kotlinx.coroutines.isActive\n'
          assert old_import in text and 'import kotlinx.coroutines.Job\n' not in text
          text = text.replace(old_import, new_import, 1)

          old_field = '    private val epgScope = CoroutineScope(SupervisorJob() + Dispatchers.Default)\n'
          new_field = old_field + '    private var epgJob: Job? = null\n'
          assert old_field in text and 'private var epgJob: Job?' not in text
          text = text.replace(old_field, new_field, 1)

          old_start = '''    private fun loadEpgInBackground(sourceUrl: String, epgUrls: List<String>) {\n        if (epgUrls.isEmpty()) return\n        epgScope.launch {\n'''
          new_start = '''    private fun loadEpgInBackground(sourceUrl: String, epgUrls: List<String>) {\n        epgJob?.cancel()\n        if (epgUrls.isEmpty()) return\n        epgJob = epgScope.launch {\n'''
          assert old_start in text
          text = text.replace(old_start, new_start, 1)

          old_publish = '''            if (mutableUiState.value.sourceUrl == sourceUrl) {\n                mutableUiState.value = mutableUiState.value.copy(\n'''
          new_publish = '''            if (!isActive) return@launch\n            if (mutableUiState.value.sourceUrl == sourceUrl) {\n                mutableUiState.value = mutableUiState.value.copy(\n'''
          assert old_publish in text
          text = text.replace(old_publish, new_publish, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt
          git commit -m 'fix: discard superseded EPG requests'
          git push origin HEAD:feature/favorites-epg-grid
