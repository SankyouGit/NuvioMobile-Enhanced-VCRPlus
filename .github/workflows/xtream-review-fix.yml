name: Xtream Final Validation

on:
  push:
    branches:
      - feature/xtream-epg-categories

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/xtream-epg-categories
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Apply final scoped-request fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt")
          text = path.read_text()

          old = "\n".join([
              "            else -> {",
              "                var scopedRequestFailed = false",
              "                val scopedData = selectedCategoryIds",
              "                    .sorted()",
              "                    .flatMap { categoryId ->",
              "                        runCatching {",
              "                            request(",
              "                                settings = settings,",
              "                                action = \"get_live_streams\",",
              "                                extraParameters = mapOf(\"category_id\" to categoryId),",
              "                            ).jsonArrayOrEmpty()",
              "                        }.getOrElse {",
              "                            scopedRequestFailed = true",
              "                            emptyList()",
              "                        }",
              "                    }",
              "                if (!scopedRequestFailed) {",
              "                    scopedData",
              "                } else {",
              "                    request(settings, action = \"get_live_streams\")",
              "                        .jsonArrayOrEmpty()",
              "                        .filter { element ->",
              "                            val obj = element as? JsonObject",
              "                            obj?.stringValue(\"category_id\") in selectedCategoryIds",
              "                        }",
              "                }",
              "            }",
          ]) + "\n"

          new = "\n".join([
              "            else -> {",
              "                val scopedData = mutableListOf<JsonElement>()",
              "                var scopedRequestFailed = false",
              "                for (categoryId in selectedCategoryIds.sorted()) {",
              "                    val response = runCatching {",
              "                        request(",
              "                            settings = settings,",
              "                            action = \"get_live_streams\",",
              "                            extraParameters = mapOf(\"category_id\" to categoryId),",
              "                        )",
              "                    }.getOrNull()",
              "                    if (response !is JsonArray) {",
              "                        scopedRequestFailed = true",
              "                        break",
              "                    }",
              "                    scopedData.addAll(response)",
              "                }",
              "                if (!scopedRequestFailed) {",
              "                    scopedData",
              "                } else {",
              "                    request(settings, action = \"get_live_streams\")",
              "                        .jsonArrayOrEmpty()",
              "                        .filter { element ->",
              "                            val obj = element as? JsonObject",
              "                            obj?.stringValue(\"category_id\") in selectedCategoryIds",
              "                        }",
              "                }",
              "            }",
          ]) + "\n"

          if old in text:
              path.write_text(text.replace(old, new, 1))
          elif new not in text:
              raise SystemExit("Scoped Xtream block is in an unexpected state")
          PY
          git diff --check

      - name: Commit final fixes if changed
        shell: bash
        run: |
          if git diff --quiet -- composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt; then
            echo "Final Xtream scoped-request fixes already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt
            git commit -m "fix: fail fast on unsupported Xtream category requests"
            git push origin HEAD:feature/xtream-epg-categories
          fi

      - name: Create CI local properties
        run: touch local.properties

      - name: Build side-by-side Full APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -PnuvioDebugApplicationId=com.nuvio.enhanced.vcrplus --stacktrace

      - name: Upload Xtream test APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-vcrplus-xtream-debug
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
