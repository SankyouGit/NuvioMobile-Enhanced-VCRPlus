name: Xtream Review Fix

on:
  push:
    branches:
      - feature/xtream-epg-categories

permissions:
  contents: write

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/xtream-epg-categories
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Apply review fixes if needed
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt")
          text = path.read_text()

          old_discovery = "\n".join([
              "        mutableUiState.value = mutableUiState.value.copy(",
              "            sourceType = LiveTvSourceType.Xtream,",
              "            sourceUrl = normalizedSettings.serverUrl,",
              "            xtreamSettings = normalizedSettings,",
              "            isLoading = true,",
              "            errorMessage = null,",
              "        )",
              "",
              "        return runCatching {",
              "            val categoryMap = withContext(Dispatchers.Default) {",
              "                LiveTvRepositoryXtream.getLiveCategories(normalizedSettings)",
              "            }",
              "            val categories = categoryMap",
              "                .map { (id, name) -> LiveTvXtreamCategory(id = id, name = name) }",
              "                .sortedBy { it.name.lowercase() }",
              "            require(categories.isNotEmpty()) { \"No live categories were found for this Xtream provider.\" }",
              "            val validSelection = normalizedSettings.selectedCategoryIds.intersect(categoryMap.keys)",
              "            mutableUiState.value = mutableUiState.value.copy(",
              "                sourceType = LiveTvSourceType.Xtream,",
              "                sourceUrl = normalizedSettings.serverUrl,",
              "                xtreamSettings = normalizedSettings.copy(selectedCategoryIds = validSelection),",
              "                isLoading = false,",
              "                errorMessage = null,",
              "            )",
              "            categories",
          ]) + "\n"
          new_discovery = "\n".join([
              "        mutableUiState.value = mutableUiState.value.copy(",
              "            isLoading = true,",
              "            errorMessage = null,",
              "        )",
              "",
              "        return runCatching {",
              "            val categoryMap = withContext(Dispatchers.Default) {",
              "                LiveTvRepositoryXtream.getLiveCategories(normalizedSettings)",
              "            }",
              "            val categories = categoryMap",
              "                .map { (id, name) -> LiveTvXtreamCategory(id = id, name = name) }",
              "                .sortedBy { it.name.lowercase() }",
              "            require(categories.isNotEmpty()) { \"No live categories were found for this Xtream provider.\" }",
              "            mutableUiState.value = mutableUiState.value.copy(",
              "                isLoading = false,",
              "                errorMessage = null,",
              "            )",
              "            categories",
          ]) + "\n"
          if old_discovery in text:
              text = text.replace(old_discovery, new_discovery, 1)
          elif new_discovery not in text:
              raise SystemExit("Xtream discovery marker is in an unexpected state")

          old_scoped = "\n".join([
              "            val scopedData = selectedCategoryIds",
              "                .sorted()",
              "                .flatMap { categoryId ->",
              "                    runCatching {",
              "                        request(",
              "                            settings = settings,",
              "                            action = \"get_live_streams\",",
              "                            extraParameters = mapOf(\"category_id\" to categoryId),",
              "                        ).jsonArrayOrEmpty()",
              "                    }.getOrElse { emptyList() }",
              "                }",
              "            if (scopedData.isNotEmpty()) {",
              "                scopedData",
              "            } else {",
              "                request(settings, action = \"get_live_streams\")",
              "                    .jsonArrayOrEmpty()",
              "                    .filter { element ->",
              "                        val obj = element as? JsonObject",
              "                        obj?.stringValue(\"category_id\") in selectedCategoryIds",
              "                    }",
              "            }",
          ]) + "\n"
          new_scoped = "\n".join([
              "            var scopedRequestFailed = false",
              "            val scopedData = selectedCategoryIds",
              "                .sorted()",
              "                .flatMap { categoryId ->",
              "                    runCatching {",
              "                        request(",
              "                            settings = settings,",
              "                            action = \"get_live_streams\",",
              "                            extraParameters = mapOf(\"category_id\" to categoryId),",
              "                        ).jsonArrayOrEmpty()",
              "                    }.getOrElse {",
              "                        scopedRequestFailed = true",
              "                        emptyList()",
              "                    }",
              "                }",
              "            if (!scopedRequestFailed) {",
              "                scopedData",
              "            } else {",
              "                request(settings, action = \"get_live_streams\")",
              "                    .jsonArrayOrEmpty()",
              "                    .filter { element ->",
              "                        val obj = element as? JsonObject",
              "                        obj?.stringValue(\"category_id\") in selectedCategoryIds",
              "                    }",
              "            }",
          ]) + "\n"
          if old_scoped in text:
              text = text.replace(old_scoped, new_scoped, 1)
          elif new_scoped not in text:
              raise SystemExit("Xtream scoped-request marker is in an unexpected state")

          path.write_text(text)
          PY
          git diff --check

      - name: Commit review fixes if changed
        shell: bash
        run: |
          if git diff --quiet -- composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt; then
            echo "Xtream review fixes already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt
            git commit -m "fix: keep Xtream discovery non-destructive"
            git push origin HEAD:feature/xtream-epg-categories
          fi

      - name: Create CI local properties
        run: touch local.properties

      - name: Build side-by-side Full APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -PnuvioDebugApplicationId=com.nuvio.enhanced.vcrplus --stacktrace

      - name: Upload Xtream test APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-vcrplus-xtream-debug
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
