name: APK Install Diagnostics

on:
  push:
    branches:
      - ci/apk-install-diagnostics

permissions:
  actions: read
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Download exact side-by-side artifact
        shell: bash
        run: |
          set -euxo pipefail
          gh api repos/${{ github.repository }}/actions/artifacts/9240051884/zip > artifact.zip
          unzip -q artifact.zip -d artifact
          find artifact -maxdepth 3 -type f -print
      - name: Inspect APK
        shell: bash
        run: |
          set -euxo pipefail
          APK=$(find artifact -name '*.apk' -type f | head -1)
          test -n "$APK"
          echo "APK=$APK"
          ls -lh "$APK"
          sha256sum "$APK"
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          echo "BUILD_TOOLS=$BUILD_TOOLS"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK"
          "$BUILD_TOOLS/aapt" dump permissions "$APK"
          if command -v apkanalyzer >/dev/null 2>&1; then
            apkanalyzer manifest application-id "$APK" || true
            apkanalyzer manifest min-sdk "$APK" || true
            apkanalyzer manifest target-sdk "$APK" || true
          fi
