name: Patch EPG Serialization Once

on:
  push:
    branches:
      - feature/favorites-epg-grid
    paths:
      - '.github/workflows/patch-epg-serialization-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/favorites-epg-grid

      - name: Serialize and debounce EPG reparses
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt')
          text = path.read_text()

          old_imports = '''import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.Job\nimport kotlinx.coroutines.isActive\nimport kotlinx.coroutines.SupervisorJob\n'''
          new_imports = '''import kotlinx.coroutines.Dispatchers\nimport kotlinx.coroutines.Job\nimport kotlinx.coroutines.delay\nimport kotlinx.coroutines.isActive\nimport kotlinx.coroutines.SupervisorJob\nimport kotlinx.coroutines.sync.Mutex\n'''
          assert old_imports in text
          text = text.replace(old_imports, new_imports, 1)

          old_fields = '''    private val epgScope = CoroutineScope(SupervisorJob() + Dispatchers.Default)\n    private var epgJob: Job? = null\n    private var activeEpgSourceUrl: String? = null\n    private var activeEpgUrls: List<String> = emptyList()\n'''
          new_fields = '''    private val epgScope = CoroutineScope(SupervisorJob() + Dispatchers.Default)\n    private val epgMutex = Mutex()\n    private var epgJob: Job? = null\n    private var favoriteEpgReloadJob: Job? = null\n    private var activeEpgSourceUrl: String? = null\n    private var activeEpgUrls: List<String> = emptyList()\n'''
          assert old_fields in text
          text = text.replace(old_fields, new_fields, 1)

          old_favorite_reload = '''        if (\n            wasAdded &&\n            !channel.tvgId.isNullOrBlank() &&\n            activeEpgUrls.isNotEmpty() &&\n            activeEpgSourceUrl == state.sourceUrl\n        ) {\n            mutableUiState.value = mutableUiState.value.copy(isEpgLoading = true)\n            loadEpgInBackground(state.sourceUrl, activeEpgUrls)\n        }\n'''
          new_favorite_reload = '''        if (\n            !channel.tvgId.isNullOrBlank() &&\n            activeEpgUrls.isNotEmpty() &&\n            activeEpgSourceUrl == state.sourceUrl\n        ) {\n            favoriteEpgReloadJob?.cancel()\n            favoriteEpgReloadJob = epgScope.launch {\n                delay(600L)\n                val latestState = mutableUiState.value\n                if (\n                    activeEpgUrls.isNotEmpty() &&\n                    activeEpgSourceUrl == latestState.sourceUrl\n                ) {\n                    mutableUiState.value = latestState.copy(isEpgLoading = true)\n                    loadEpgInBackground(latestState.sourceUrl, activeEpgUrls)\n                }\n            }\n        }\n'''
          assert old_favorite_reload in text
          text = text.replace(old_favorite_reload, new_favorite_reload, 1)

          old_job = '''        epgJob = epgScope.launch {\n            val nowEpochMs = LiveTvClock.nowEpochMs()\n            val programmesByChannel = mergeXmlTvProgrammeSchedules(\n                epgUrls.mapNotNull { epgUrl ->\n                    runCatching {\n                        parseXmlTvProgrammeSchedule(\n                            content = httpGetText(epgUrl),\n                            nowEpochMs = nowEpochMs,\n                        )\n                    }.getOrNull()\n                },\n            )\n            if (!isActive) return@launch\n            if (mutableUiState.value.sourceUrl == sourceUrl) {\n                mutableUiState.value = mutableUiState.value.copy(\n                    programmesByChannel = programmesByChannel,\n                    currentProgrammes = currentXmlTvProgrammes(programmesByChannel, nowEpochMs),\n                    isEpgLoading = false,\n                )\n            }\n        }\n'''
          new_job = '''        epgJob = epgScope.launch {\n            epgMutex.lock()\n            try {\n                if (!isActive) return@launch\n                val nowEpochMs = LiveTvClock.nowEpochMs()\n                val programmesByChannel = mergeXmlTvProgrammeSchedules(\n                    epgUrls.mapNotNull { epgUrl ->\n                        runCatching {\n                            parseXmlTvProgrammeSchedule(\n                                content = httpGetText(epgUrl),\n                                nowEpochMs = nowEpochMs,\n                            )\n                        }.getOrNull()\n                    },\n                )\n                if (!isActive) return@launch\n                if (mutableUiState.value.sourceUrl == sourceUrl) {\n                    mutableUiState.value = mutableUiState.value.copy(\n                        programmesByChannel = programmesByChannel,\n                        currentProgrammes = currentXmlTvProgrammes(programmesByChannel, nowEpochMs),\n                        isEpgLoading = false,\n                    )\n                }\n            } finally {\n                epgMutex.unlock()\n            }\n        }\n'''
          assert old_job in text
          text = text.replace(old_job, new_job, 1)

          path.write_text(text)
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt
          git commit -m 'fix: serialize and debounce EPG reloads'
          git push origin HEAD:feature/favorites-epg-grid
