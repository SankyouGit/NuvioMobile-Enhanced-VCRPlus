name: Apply Xtream Upgrade

on:
  push:
    branches:
      - feature/xtream-epg-categories

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[xtream-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/xtream-epg-categories
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - name: Apply focused Xtream changes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"marker not found in {path}: {old[:120]!r}")
              if text.count(old) != 1:
                  raise SystemExit(f"marker not unique in {path}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          def replace_between(path, start, end, replacement):
              text = read(path)
              a = text.find(start)
              if a < 0:
                  raise SystemExit(f"start marker not found in {path}: {start!r}")
              b = text.find(end, a + len(start))
              if b < 0:
                  raise SystemExit(f"end marker not found in {path}: {end!r}")
              write(path, text[:a] + replacement + text[b:])

          models = "composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvModels.kt"
          replace_once(
              models,
              '''data class LiveTvProgramme(\n    val title: String,\n    val startEpochMs: Long,\n    val stopEpochMs: Long,\n    val timeLabel: String,\n)\n''',
              '''data class LiveTvProgramme(\n    val title: String,\n    val startEpochMs: Long,\n    val stopEpochMs: Long,\n    val timeLabel: String,\n)\n\ndata class LiveTvXtreamCategory(\n    val id: String,\n    val name: String,\n)\n''',
          )
          replace_once(
              models,
              '''data class LiveTvXtreamSettings(\n    val serverUrl: String = "",\n    val username: String = "",\n    val password: String = "",\n) {''',
              '''data class LiveTvXtreamSettings(\n    val serverUrl: String = "",\n    val username: String = "",\n    val password: String = "",\n    val selectedCategoryIds: Set<String> = emptySet(),\n) {''',
          )

          android_storage = "composeApp/src/androidMain/kotlin/com/nuvio/app/features/livetv/LiveTvStorage.android.kt"
          replace_once(
              android_storage,
              '''    private const val xtreamPasswordKey = "xtream_password"\n''',
              '''    private const val xtreamPasswordKey = "xtream_password"\n    private const val xtreamCategoryIdsKey = "xtream_category_ids"\n''',
          )
          replace_once(
              android_storage,
              '''            password = preferences?.getScopedString(xtreamPasswordKey).orEmpty(),\n        )\n    }\n\n    actual fun saveXtreamSettings(settings: LiveTvXtreamSettings) {\n        preferences?.edit()?.apply {\n            putScopedString(xtreamServerUrlKey, settings.serverUrl)\n            putScopedString(xtreamUsernameKey, settings.username)\n            putScopedString(xtreamPasswordKey, settings.password)\n        }?.apply()\n    }''',
              '''            password = preferences?.getScopedString(xtreamPasswordKey).orEmpty(),\n            selectedCategoryIds = preferences?.getScopedString(xtreamCategoryIdsKey)\n                ?.lineSequence()\n                ?.map(String::trim)\n                ?.filter(String::isNotBlank)\n                ?.toSet()\n                .orEmpty(),\n        )\n    }\n\n    actual fun saveXtreamSettings(settings: LiveTvXtreamSettings) {\n        preferences?.edit()?.apply {\n            putScopedString(xtreamServerUrlKey, settings.serverUrl)\n            putScopedString(xtreamUsernameKey, settings.username)\n            putScopedString(xtreamPasswordKey, settings.password)\n            putScopedString(xtreamCategoryIdsKey, settings.selectedCategoryIds.sorted().joinToString("\\n"))\n        }?.apply()\n    }''',
          )

          ios_storage = "composeApp/src/iosMain/kotlin/com/nuvio/app/features/livetv/LiveTvStorage.ios.kt"
          replace_once(
              ios_storage,
              '''    private const val xtreamPasswordKey = "live_tv_xtream_password"\n''',
              '''    private const val xtreamPasswordKey = "live_tv_xtream_password"\n    private const val xtreamCategoryIdsKey = "live_tv_xtream_category_ids"\n''',
          )
          replace_once(
              ios_storage,
              '''            password = loadScopedString(xtreamPasswordKey).orEmpty(),\n        )\n    }\n\n    actual fun saveXtreamSettings(settings: LiveTvXtreamSettings) {\n        saveScopedString(xtreamServerUrlKey, settings.serverUrl)\n        saveScopedString(xtreamUsernameKey, settings.username)\n        saveScopedString(xtreamPasswordKey, settings.password)\n    }''',
              '''            password = loadScopedString(xtreamPasswordKey).orEmpty(),\n            selectedCategoryIds = loadScopedString(xtreamCategoryIdsKey)\n                .orEmpty()\n                .lineSequence()\n                .map(String::trim)\n                .filter(String::isNotBlank)\n                .toSet(),\n        )\n    }\n\n    actual fun saveXtreamSettings(settings: LiveTvXtreamSettings) {\n        saveScopedString(xtreamServerUrlKey, settings.serverUrl)\n        saveScopedString(xtreamUsernameKey, settings.username)\n        saveScopedString(xtreamPasswordKey, settings.password)\n        saveScopedString(xtreamCategoryIdsKey, settings.selectedCategoryIds.sorted().joinToString("\\n"))\n    }''',
          )

          repo = "composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt"
          replace_once(
              repo,
              '''    private var activeEpgUrls: List<String> = emptyList()\n''',
              '''    private var activeEpgUrls: List<String> = emptyList()\n    private var activeEpgRequestHeaders: Map<String, String> = emptyMap()\n''',
          )

          replace_between(
              repo,
              '    suspend fun loadXtream(settings: LiveTvXtreamSettings): Result<List<LiveTvChannel>> {',
              '    suspend fun prepareForPlayback(channel: LiveTvChannel): LiveTvChannel =',
              '''    suspend fun discoverXtreamCategories(\n        settings: LiveTvXtreamSettings,\n    ): Result<List<LiveTvXtreamCategory>> {\n        val normalizedSettings = settings.normalized()\n        if (!normalizedSettings.isConfigured) {\n            val error = IllegalArgumentException("Server URL, username, and password are required.")\n            mutableUiState.value = mutableUiState.value.copy(errorMessage = error.message)\n            return Result.failure(error)\n        }\n        if (!normalizedSettings.serverUrl.startsWith("http://") && !normalizedSettings.serverUrl.startsWith("https://")) {\n            val error = IllegalArgumentException("Enter a valid HTTP or HTTPS Xtream server URL.")\n            mutableUiState.value = mutableUiState.value.copy(errorMessage = error.message)\n            return Result.failure(error)\n        }\n\n        mutableUiState.value = mutableUiState.value.copy(\n            sourceType = LiveTvSourceType.Xtream,\n            sourceUrl = normalizedSettings.serverUrl,\n            xtreamSettings = normalizedSettings,\n            isLoading = true,\n            errorMessage = null,\n        )\n\n        return runCatching {\n            val categoryMap = withContext(Dispatchers.Default) {\n                LiveTvRepositoryXtream.getLiveCategories(normalizedSettings)\n            }\n            val categories = categoryMap\n                .map { (id, name) -> LiveTvXtreamCategory(id = id, name = name) }\n                .sortedBy { it.name.lowercase() }\n            require(categories.isNotEmpty()) { "No live categories were found for this Xtream provider." }\n            val validSelection = normalizedSettings.selectedCategoryIds.intersect(categoryMap.keys)\n            mutableUiState.value = mutableUiState.value.copy(\n                sourceType = LiveTvSourceType.Xtream,\n                sourceUrl = normalizedSettings.serverUrl,\n                xtreamSettings = normalizedSettings.copy(selectedCategoryIds = validSelection),\n                isLoading = false,\n                errorMessage = null,\n            )\n            categories\n        }.onFailure { error ->\n            mutableUiState.value = mutableUiState.value.copy(\n                isLoading = false,\n                errorMessage = error.message ?: "Xtream categories could not be loaded.",\n            )\n        }\n    }\n\n    suspend fun loadXtream(settings: LiveTvXtreamSettings): Result<List<LiveTvChannel>> {\n        val normalizedSettings = settings.normalized()\n        if (!normalizedSettings.isConfigured) {\n            val error = IllegalArgumentException("Server URL, username, and password are required.")\n            mutableUiState.value = mutableUiState.value.copy(errorMessage = error.message)\n            return Result.failure(error)\n        }\n        if (!normalizedSettings.serverUrl.startsWith("http://") && !normalizedSettings.serverUrl.startsWith("https://")) {\n            val error = IllegalArgumentException("Enter a valid HTTP or HTTPS Xtream server URL.")\n            mutableUiState.value = mutableUiState.value.copy(errorMessage = error.message)\n            return Result.failure(error)\n        }\n\n        mutableUiState.value = mutableUiState.value.copy(\n            sourceType = LiveTvSourceType.Xtream,\n            sourceUrl = normalizedSettings.serverUrl,\n            xtreamSettings = normalizedSettings,\n            isLoading = true,\n            errorMessage = null,\n        )\n\n        return runCatching {\n            val categoryMap = withContext(Dispatchers.Default) {\n                LiveTvRepositoryXtream.getLiveCategories(normalizedSettings)\n            }\n            val requestedCategoryIds = normalizedSettings.selectedCategoryIds\n            val validCategoryIds = requestedCategoryIds.intersect(categoryMap.keys)\n            if (requestedCategoryIds.isNotEmpty()) {\n                require(validCategoryIds.isNotEmpty()) {\n                    "Your selected Xtream categories are no longer available. Reload categories and choose again."\n                }\n            }\n            val effectiveSettings = normalizedSettings.copy(selectedCategoryIds = validCategoryIds)\n            val channels = withContext(Dispatchers.Default) {\n                fetchXtreamChannels(effectiveSettings, categoryMap)\n            }\n            require(channels.isNotEmpty()) { "No playable channels were found for the selected Xtream categories." }\n            LiveTvStorage.saveLocalPlaylistData("")\n            LiveTvStorage.saveSourceType(LiveTvSourceType.Xtream)\n            LiveTvStorage.saveXtreamSettings(effectiveSettings)\n            mutableUiState.value = LiveTvUiState(\n                sourceType = LiveTvSourceType.Xtream,\n                sourceUrl = effectiveSettings.serverUrl,\n                stalkerSettings = mutableUiState.value.stalkerSettings,\n                xtreamSettings = effectiveSettings,\n                channels = channels,\n                favoriteUrls = mutableUiState.value.favoriteUrls,\n                recentChannel = mutableUiState.value.recentChannel,\n                isEpgLoading = true,\n                isLoaded = true,\n            )\n            loadEpgInBackground(\n                sourceUrl = effectiveSettings.serverUrl,\n                epgUrls = listOf(effectiveSettings.xmlTvEndpoint()),\n                requestHeaders = M3U_PLAYLIST_REQUEST_HEADERS,\n            )\n            channels\n        }.onFailure { error ->\n            mutableUiState.value = mutableUiState.value.copy(\n                isLoading = false,\n                isEpgLoading = false,\n                isLoaded = mutableUiState.value.channels.isNotEmpty(),\n                errorMessage = error.message ?: "Xtream provider could not be loaded.",\n            )\n        }\n    }\n\n''',
          )

          replace_once(
              repo,
              '''                    loadEpgInBackground(latestState.sourceUrl, activeEpgUrls)\n''',
              '''                    loadEpgInBackground(\n                        sourceUrl = latestState.sourceUrl,\n                        epgUrls = activeEpgUrls,\n                        requestHeaders = activeEpgRequestHeaders,\n                    )\n''',
          )

          replace_between(
              repo,
              '    private fun loadEpgInBackground(sourceUrl: String, epgUrls: List<String>) {',
              'internal expect object LiveTvStorage',
              '''    private fun loadEpgInBackground(\n        sourceUrl: String,\n        epgUrls: List<String>,\n        requestHeaders: Map<String, String> = emptyMap(),\n    ) {\n        activeEpgSourceUrl = sourceUrl\n        activeEpgUrls = epgUrls\n        activeEpgRequestHeaders = requestHeaders\n        epgJob?.cancel()\n        if (epgUrls.isEmpty()) {\n            mutableUiState.value = mutableUiState.value.copy(isEpgLoading = false)\n            return\n        }\n        epgJob = epgScope.launch {\n            epgMutex.lock()\n            try {\n                if (!isActive) return@launch\n                val nowEpochMs = LiveTvClock.nowEpochMs()\n                val programmesByChannel = mergeXmlTvProgrammeSchedules(\n                    epgUrls.mapNotNull { epgUrl ->\n                        runCatching {\n                            val content = if (requestHeaders.isEmpty()) {\n                                httpGetText(epgUrl)\n                            } else {\n                                httpGetTextWithHeaders(epgUrl, requestHeaders)\n                            }\n                            parseXmlTvProgrammeSchedule(\n                                content = content,\n                                nowEpochMs = nowEpochMs,\n                            )\n                        }.getOrNull()\n                    },\n                )\n                if (!isActive) return@launch\n                if (mutableUiState.value.sourceUrl == sourceUrl) {\n                    mutableUiState.value = mutableUiState.value.copy(\n                        programmesByChannel = programmesByChannel,\n                        currentProgrammes = currentXmlTvProgrammes(programmesByChannel, nowEpochMs),\n                        isEpgLoading = false,\n                    )\n                }\n            } finally {\n                epgMutex.unlock()\n            }\n        }\n    }\n}\n\n''',
          )

          replace_between(
              repo,
              'private suspend fun fetchXtreamChannels(settings: LiveTvXtreamSettings): List<LiveTvChannel> {',
              'private object LiveTvRepositoryXtream {',
              '''private suspend fun fetchXtreamChannels(\n    settings: LiveTvXtreamSettings,\n    categories: Map<String, String>? = null,\n): List<LiveTvChannel> {\n    val categoryMap = categories ?: LiveTvRepositoryXtream.getLiveCategories(settings)\n    return LiveTvRepositoryXtream.getLiveStreams(\n        settings = settings,\n        categories = categoryMap,\n        selectedCategoryIds = settings.selectedCategoryIds.intersect(categoryMap.keys),\n    )\n}\n\n''',
          )

          replace_between(
              repo,
              'private object LiveTvRepositoryXtream {',
              'private object LiveTvRepositoryStalker {',
              '''private object LiveTvRepositoryXtream {\n    suspend fun getLiveCategories(settings: LiveTvXtreamSettings): Map<String, String> {\n        val data = request(settings, action = "get_live_categories").jsonArrayOrEmpty()\n        return data.associateNotNull { element ->\n            val obj = element as? JsonObject ?: return@associateNotNull null\n            val id = obj.stringValue("category_id") ?: obj.stringValue("id") ?: return@associateNotNull null\n            val name = obj.stringValue("category_name") ?: obj.stringValue("name") ?: return@associateNotNull null\n            id to name\n        }\n    }\n\n    suspend fun getLiveStreams(\n        settings: LiveTvXtreamSettings,\n        categories: Map<String, String>,\n        selectedCategoryIds: Set<String> = emptySet(),\n    ): List<LiveTvChannel> {\n        val data = if (selectedCategoryIds.isEmpty()) {\n            request(settings, action = "get_live_streams").jsonArrayOrEmpty()\n        } else {\n            val scopedData = selectedCategoryIds\n                .sorted()\n                .flatMap { categoryId ->\n                    runCatching {\n                        request(\n                            settings = settings,\n                            action = "get_live_streams",\n                            extraParameters = mapOf("category_id" to categoryId),\n                        ).jsonArrayOrEmpty()\n                    }.getOrElse { emptyList() }\n                }\n            if (scopedData.isNotEmpty()) {\n                scopedData\n            } else {\n                request(settings, action = "get_live_streams")\n                    .jsonArrayOrEmpty()\n                    .filter { element ->\n                        val obj = element as? JsonObject\n                        obj?.stringValue("category_id") in selectedCategoryIds\n                    }\n            }\n        }\n\n        return data.mapIndexedNotNull { index, element ->\n            val obj = element as? JsonObject ?: return@mapIndexedNotNull null\n            val name = obj.stringValue("name") ?: return@mapIndexedNotNull null\n            val streamId = obj.stringValue("stream_id") ?: obj.stringValue("id") ?: return@mapIndexedNotNull null\n            val categoryId = obj.stringValue("category_id")\n            if (selectedCategoryIds.isNotEmpty() && categoryId !in selectedCategoryIds) {\n                return@mapIndexedNotNull null\n            }\n            val directSource = obj.stringValue("direct_source")\n                ?.takeIf { it.startsWith("http://", ignoreCase = true) || it.startsWith("https://", ignoreCase = true) }\n            val extension = obj.stringValue("container_extension")\n                ?.trim()\n                ?.trimStart('.')\n                ?.takeIf(String::isNotBlank)\n                ?: "ts"\n            val streamUrl = directSource ?: settings.liveStreamUrl(streamId, extension)\n            LiveTvChannel(\n                id = "xtream-$streamId-$index",\n                name = name,\n                streamUrl = streamUrl,\n                tvgId = obj.stringValue("epg_channel_id") ?: obj.stringValue("tvg_id"),\n                logoUrl = obj.stringValue("stream_icon") ?: obj.stringValue("logo"),\n                group = categoryId?.let(categories::get).orEmpty(),\n                headers = M3U_STREAM_REQUEST_HEADERS,\n            )\n        }.distinctBy { it.streamUrl }\n    }\n\n    private suspend fun request(\n        settings: LiveTvXtreamSettings,\n        action: String,\n        extraParameters: Map<String, String> = emptyMap(),\n    ): JsonElement {\n        val parameters = buildMap {\n            put("username", settings.username)\n            put("password", settings.password)\n            put("action", action)\n            putAll(extraParameters)\n        }\n        val url = settings.playerApiEndpoint() + parameters.entries.joinToString(\n            separator = "&",\n            prefix = "?",\n        ) { (key, value) ->\n            "${key.encodeURLParameter()}=${value.encodeURLParameter()}"\n        }\n        return stalkerJson.parseToJsonElement(httpGetTextWithHeaders(url, M3U_PLAYLIST_REQUEST_HEADERS))\n    }\n}\n\n''',
          )

          replace_between(
              repo,
              'private fun LiveTvXtreamSettings.normalized(): LiveTvXtreamSettings =',
              'private fun LiveTvStalkerSettings.portalEndpoint(): String {',
              '''private fun LiveTvXtreamSettings.normalized(): LiveTvXtreamSettings =\n    copy(\n        serverUrl = serverUrl.trim().trimEnd('/').substringBefore("/player_api.php").trimEnd('/'),\n        username = username.trim(),\n        password = password.trim(),\n        selectedCategoryIds = selectedCategoryIds.map(String::trim).filter(String::isNotBlank).toSet(),\n    )\n\nprivate fun LiveTvXtreamSettings.playerApiEndpoint(): String =\n    "${serverUrl.trim().trimEnd('/')}/player_api.php"\n\ninternal fun LiveTvXtreamSettings.xmlTvEndpoint(): String {\n    val baseUrl = serverUrl.trim().trimEnd('/').substringBefore("/player_api.php").trimEnd('/')\n    return "$baseUrl/xmltv.php?username=${username.trim().encodeURLParameter()}&password=${password.trim().encodeURLParameter()}"\n}\n\nprivate fun LiveTvXtreamSettings.liveStreamUrl(streamId: String, extension: String): String =\n    buildString {\n        append(serverUrl.trim().trimEnd('/'))\n        append("/live/")\n        append(username.encodeURLParameter())\n        append("/")\n        append(password.encodeURLParameter())\n        append("/")\n        append(streamId.encodeURLParameter())\n        append(".")\n        append(extension.trim().trimStart('.').ifBlank { "ts" })\n    }\n\n''',
          )

          screen = "composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvScreen.kt"
          replace_once(
              screen,
              '''    var xtreamPassword by rememberSaveable { mutableStateOf(uiState.xtreamSettings.password) }\n    var fileImportError by rememberSaveable { mutableStateOf<String?>(null) }\n''',
              '''    var xtreamPassword by rememberSaveable { mutableStateOf(uiState.xtreamSettings.password) }\n    var xtreamCategories by remember { mutableStateOf<List<LiveTvXtreamCategory>>(emptyList()) }\n    var xtreamSelectedCategoryIds by remember { mutableStateOf(uiState.xtreamSettings.selectedCategoryIds) }\n    var xtreamCategoryQuery by rememberSaveable { mutableStateOf("") }\n    var fileImportError by rememberSaveable { mutableStateOf<String?>(null) }\n''',
          )
          replace_once(
              screen,
              '''    LaunchedEffect(uiState.xtreamSettings) {\n        if (xtreamServerUrl.isBlank()) xtreamServerUrl = uiState.xtreamSettings.serverUrl\n        if (xtreamUsername.isBlank()) xtreamUsername = uiState.xtreamSettings.username\n        if (xtreamPassword.isBlank()) xtreamPassword = uiState.xtreamSettings.password\n    }\n''',
              '''    LaunchedEffect(uiState.xtreamSettings) {\n        if (xtreamServerUrl.isBlank()) xtreamServerUrl = uiState.xtreamSettings.serverUrl\n        if (xtreamUsername.isBlank()) xtreamUsername = uiState.xtreamSettings.username\n        if (xtreamPassword.isBlank()) xtreamPassword = uiState.xtreamSettings.password\n        if (xtreamSelectedCategoryIds.isEmpty() && uiState.xtreamSettings.selectedCategoryIds.isNotEmpty()) {\n            xtreamSelectedCategoryIds = uiState.xtreamSettings.selectedCategoryIds\n        }\n    }\n''',
          )
          replace_between(
              screen,
              '    val loadXtreamSource: () -> Unit = {',
              '    val playChannel: (LiveTvChannel) -> Unit = { channel ->',
              '''    val discoverXtreamCategories: () -> Unit = {\n        scope.launch {\n            val settings = LiveTvXtreamSettings(\n                serverUrl = xtreamServerUrl,\n                username = xtreamUsername,\n                password = xtreamPassword,\n                selectedCategoryIds = xtreamSelectedCategoryIds,\n            )\n            LiveTvRepository.discoverXtreamCategories(settings)\n                .onSuccess { categories ->\n                    xtreamCategories = categories\n                    val validIds = categories.map(LiveTvXtreamCategory::id).toSet()\n                    xtreamSelectedCategoryIds = xtreamSelectedCategoryIds.intersect(validIds)\n                }\n        }\n        Unit\n    }\n    val loadXtreamSource: () -> Unit = {\n        scope.launch {\n            val settings = LiveTvXtreamSettings(\n                serverUrl = xtreamServerUrl,\n                username = xtreamUsername,\n                password = xtreamPassword,\n                selectedCategoryIds = xtreamSelectedCategoryIds,\n            )\n            if (LiveTvRepository.loadXtream(settings).isSuccess) {\n                showingAdvancedSettings = false\n                editingSource = false\n                selectedGroup = ""\n                favoritesOnly = false\n            }\n        }\n        Unit\n    }\n''',
          )

          old_card_call = '''                LiveTvXtreamSettingsCard(\n                    serverUrl = xtreamServerUrl,\n                    username = xtreamUsername,\n                    password = xtreamPassword,\n                    isLoading = uiState.isLoading,\n                    errorMessage = uiState.errorMessage,\n                    hasConnectedSource = uiState.sourceType == LiveTvSourceType.Xtream && uiState.channels.isNotEmpty(),\n                    onServerUrlChange = { xtreamServerUrl = it },\n                    onUsernameChange = { xtreamUsername = it },\n                    onPasswordChange = { xtreamPassword = it },\n                    onLoad = loadXtreamSource,\n                    onDisconnect = {\n                        LiveTvRepository.disconnect()\n                        editingSource = true\n                        showingAdvancedSettings = false\n                        favoritesOnly = false\n                        selectedGroup = ""\n                    },\n                )'''
          new_card_call = '''                LiveTvXtreamSettingsCard(\n                    serverUrl = xtreamServerUrl,\n                    username = xtreamUsername,\n                    password = xtreamPassword,\n                    categories = xtreamCategories,\n                    selectedCategoryIds = xtreamSelectedCategoryIds,\n                    categoryQuery = xtreamCategoryQuery,\n                    isLoading = uiState.isLoading,\n                    errorMessage = uiState.errorMessage,\n                    hasConnectedSource = uiState.sourceType == LiveTvSourceType.Xtream && uiState.channels.isNotEmpty(),\n                    onServerUrlChange = {\n                        xtreamServerUrl = it\n                        xtreamCategories = emptyList()\n                        xtreamSelectedCategoryIds = emptySet()\n                    },\n                    onUsernameChange = {\n                        xtreamUsername = it\n                        xtreamCategories = emptyList()\n                        xtreamSelectedCategoryIds = emptySet()\n                    },\n                    onPasswordChange = {\n                        xtreamPassword = it\n                        xtreamCategories = emptyList()\n                        xtreamSelectedCategoryIds = emptySet()\n                    },\n                    onCategoryQueryChange = { xtreamCategoryQuery = it },\n                    onDiscoverCategories = discoverXtreamCategories,\n                    onToggleCategory = { categoryId ->\n                        xtreamSelectedCategoryIds = if (categoryId in xtreamSelectedCategoryIds) {\n                            xtreamSelectedCategoryIds - categoryId\n                        } else {\n                            xtreamSelectedCategoryIds + categoryId\n                        }\n                    },\n                    onSelectAllCategories = {\n                        xtreamSelectedCategoryIds = xtreamCategories.map(LiveTvXtreamCategory::id).toSet()\n                    },\n                    onClearCategories = { xtreamSelectedCategoryIds = emptySet() },\n                    onLoad = loadXtreamSource,\n                    onDisconnect = {\n                        LiveTvRepository.disconnect()\n                        editingSource = true\n                        showingAdvancedSettings = false\n                        favoritesOnly = false\n                        selectedGroup = ""\n                    },\n                )'''
          replace_once(screen, old_card_call, new_card_call)

          replace_between(
              screen,
              '@Composable\nprivate fun LiveTvXtreamSettingsCard(',
              '@Composable\nprivate fun SourceTypePillRow(',
              '''@Composable\nprivate fun LiveTvXtreamSettingsCard(\n    serverUrl: String,\n    username: String,\n    password: String,\n    categories: List<LiveTvXtreamCategory>,\n    selectedCategoryIds: Set<String>,\n    categoryQuery: String,\n    isLoading: Boolean,\n    errorMessage: String?,\n    hasConnectedSource: Boolean,\n    onServerUrlChange: (String) -> Unit,\n    onUsernameChange: (String) -> Unit,\n    onPasswordChange: (String) -> Unit,\n    onCategoryQueryChange: (String) -> Unit,\n    onDiscoverCategories: () -> Unit,\n    onToggleCategory: (String) -> Unit,\n    onSelectAllCategories: () -> Unit,\n    onClearCategories: () -> Unit,\n    onLoad: () -> Unit,\n    onDisconnect: () -> Unit,\n) {\n    val tokens = MaterialTheme.nuvio\n    val visibleCategories = remember(categories, categoryQuery) {\n        categories\n            .filter { category ->\n                categoryQuery.isBlank() || category.name.contains(categoryQuery, ignoreCase = true)\n            }\n            .take(12)\n    }\n    Surface(\n        modifier = Modifier.fillMaxWidth(),\n        color = tokens.colors.surface,\n        shape = tokens.shapes.card,\n        border = BorderStroke(NuvioTokens.Border.thin, tokens.colors.borderSubtle),\n    ) {\n        Column(\n            modifier = Modifier.padding(tokens.spacing.cardPadding),\n            verticalArrangement = Arrangement.spacedBy(NuvioTokens.Space.s12),\n        ) {\n            Row(\n                verticalAlignment = Alignment.CenterVertically,\n                horizontalArrangement = Arrangement.spacedBy(NuvioTokens.Space.s12),\n            ) {\n                Box(\n                    modifier = Modifier\n                        .size(NuvioTokens.Space.s48)\n                        .clip(tokens.shapes.compactCard)\n                        .background(tokens.colors.overlaySelected),\n                    contentAlignment = Alignment.Center,\n                ) {\n                    Icon(\n                        imageVector = Icons.Rounded.Tv,\n                        contentDescription = null,\n                        tint = tokens.colors.accent,\n                    )\n                }\n                Column(verticalArrangement = Arrangement.spacedBy(4.dp)) {\n                    Text(\n                        text = stringResource(Res.string.live_tv_source_xtream),\n                        style = MaterialTheme.typography.titleMedium,\n                        color = tokens.colors.textPrimary,\n                        fontWeight = FontWeight.SemiBold,\n                    )\n                    Text(\n                        text = "Choose categories before loading channels. EPG is pulled automatically from Xtream.",\n                        style = MaterialTheme.typography.bodySmall,\n                        color = tokens.colors.textMuted,\n                    )\n                }\n            }\n\n            SourceTypePillRow(\n                activeLabel = stringResource(Res.string.live_tv_source_xtream),\n                inactiveLabel = stringResource(Res.string.live_tv_source_m3u),\n            )\n\n            NuvioInputField(\n                value = serverUrl,\n                onValueChange = onServerUrlChange,\n                placeholder = stringResource(Res.string.live_tv_xtream_server_hint),\n            )\n            NuvioInputField(\n                value = username,\n                onValueChange = onUsernameChange,\n                placeholder = stringResource(Res.string.live_tv_xtream_username_hint),\n            )\n            NuvioInputField(\n                value = password,\n                onValueChange = onPasswordChange,\n                placeholder = stringResource(Res.string.live_tv_xtream_password_hint),\n            )\n\n            errorMessage?.let {\n                Text(\n                    text = it,\n                    style = MaterialTheme.typography.bodySmall,\n                    color = tokens.colors.danger,\n                )\n            }\n\n            if (categories.isEmpty()) {\n                NuvioPrimaryButton(\n                    text = "Load categories",\n                    enabled = serverUrl.isNotBlank() && username.isNotBlank() && password.isNotBlank() && !isLoading,\n                    onClick = onDiscoverCategories,\n                )\n            } else {\n                Text(\n                    text = "${selectedCategoryIds.size} of ${categories.size} categories selected",\n                    style = MaterialTheme.typography.labelLarge,\n                    color = tokens.colors.textPrimary,\n                )\n                NuvioInputField(\n                    value = categoryQuery,\n                    onValueChange = onCategoryQueryChange,\n                    placeholder = "Search categories",\n                )\n                Row(\n                    modifier = Modifier.fillMaxWidth(),\n                    horizontalArrangement = Arrangement.spacedBy(8.dp),\n                ) {\n                    OutlinedButton(\n                        modifier = Modifier.weight(1f),\n                        onClick = onSelectAllCategories,\n                    ) {\n                        Text("Select all")\n                    }\n                    OutlinedButton(\n                        modifier = Modifier.weight(1f),\n                        onClick = onClearCategories,\n                    ) {\n                        Text("Clear")\n                    }\n                }\n                visibleCategories.forEach { category ->\n                    val selected = category.id in selectedCategoryIds\n                    Surface(\n                        modifier = Modifier.fillMaxWidth(),\n                        onClick = { onToggleCategory(category.id) },\n                        color = if (selected) tokens.colors.overlaySelected else tokens.colors.surfaceCard,\n                        shape = tokens.shapes.compactCard,\n                        border = BorderStroke(\n                            NuvioTokens.Border.thin,\n                            if (selected) tokens.colors.accent.copy(alpha = 0.52f) else tokens.colors.borderSubtle,\n                        ),\n                    ) {\n                        Row(\n                            modifier = Modifier.padding(horizontal = 12.dp, vertical = 10.dp),\n                            horizontalArrangement = Arrangement.SpaceBetween,\n                            verticalAlignment = Alignment.CenterVertically,\n                        ) {\n                            Text(\n                                text = category.name,\n                                modifier = Modifier.weight(1f),\n                                style = MaterialTheme.typography.bodyMedium,\n                                color = tokens.colors.textPrimary,\n                                maxLines = 1,\n                                overflow = TextOverflow.Ellipsis,\n                            )\n                            Text(\n                                text = if (selected) "✓" else "",\n                                style = MaterialTheme.typography.titleMedium,\n                                color = tokens.colors.accent,\n                            )\n                        }\n                    }\n                }\n                if (categories.count {\n                        categoryQuery.isBlank() || it.name.contains(categoryQuery, ignoreCase = true)\n                    } > visibleCategories.size\n                ) {\n                    Text(\n                        text = "Showing the first ${visibleCategories.size}. Search to narrow the list.",\n                        style = MaterialTheme.typography.bodySmall,\n                        color = tokens.colors.textMuted,\n                    )\n                }\n                NuvioPrimaryButton(\n                    text = "Load selected channels",\n                    enabled = selectedCategoryIds.isNot