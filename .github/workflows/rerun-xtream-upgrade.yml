name: Rerun Xtream Upgrade

on:
  push:
    branches:
      - feature/xtream-epg-categories

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[xtream-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/xtream-epg-categories
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Apply Xtream source upgrade
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          android = Path("composeApp/src/androidMain/kotlin/com/nuvio/app/features/livetv/LiveTvStorage.android.kt")
          text = android.read_text()
          old = '''    actual fun loadXtreamSettings(): LiveTvXtreamSettings =\n        LiveTvXtreamSettings(\n'''
          new = '''    actual fun loadXtreamSettings(): LiveTvXtreamSettings {\n        return LiveTvXtreamSettings(\n'''
          if old not in text:
              raise SystemExit("Android Xtream storage normalization marker missing")
          android.write_text(text.replace(old, new, 1))

          workflow = Path(".github/workflows/apply-xtream-upgrade.yml").read_text()
          marker = "          python3 - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          lines = workflow[start:end].splitlines()
          script = "\n".join(line[10:] if line.startswith("          ") else line for line in lines)
          exec(compile(script, "apply-xtream-upgrade.py", "exec"), {"__name__": "__main__"})
          PY

      - name: Commit source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add composeApp
          git diff --cached --check
          git commit -m "feat: add category-first Xtream EPG [xtream-applied]"
          git push origin HEAD:feature/xtream-epg-categories

      - name: Create CI local properties
        run: touch local.properties

      - name: Run Android host tests
        run: ./gradlew :composeApp:testAndroidHostTest -Pnuvio.android.distribution=full --stacktrace

      - name: Build side-by-side Full APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -PnuvioDebugApplicationId=com.nuvio.enhanced.vcrplus --stacktrace
