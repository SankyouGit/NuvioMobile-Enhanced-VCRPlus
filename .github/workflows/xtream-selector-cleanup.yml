name: Xtream Selector Cleanup

on:
  push:
    branches:
      - feature/xtream-epg-categories

permissions:
  contents: write

jobs:
  patch-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/xtream-epg-categories
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Apply compact category selector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          p = Path('composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvScreen.kt')
          t = p.read_text()
          vold = base64.b64decode('').decode()
          vnew = base64.b64decode('').decode()
          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          if vold in t:
              t = t.replace(vold, vnew, 1)
          elif 'var categoryPickerExpanded by rememberSaveable' not in t:
              raise SystemExit('selector state marker not found')
          if old in t:
              t = t.replace(old, new, 1)
          elif 'Load channels · ${selectedCategoryIds.size} categories' not in t:
              raise SystemExit('selector body marker not found')
          p.write_text(t)
          PY
          git diff --check

      - name: Commit selector cleanup if changed
        shell: bash
        run: |
          if git diff --quiet -- composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvScreen.kt; then
            echo "Selector cleanup already applied."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvScreen.kt
            git commit -m "ui: simplify Xtream category selector"
            git push origin HEAD:feature/xtream-epg-categories
          fi

      - name: Create CI local properties
        run: touch local.properties

      - name: Build side-by-side Full APK
        run: ./gradlew :androidApp:assembleFullDebug -Pnuvio.android.distribution=full -PnuvioDebugApplicationId=com.nuvio.enhanced.vcrplus --stacktrace

      - name: Upload selector-cleanup APK
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-vcrplus-xtream-selector-clean-debug
          path: androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 7
