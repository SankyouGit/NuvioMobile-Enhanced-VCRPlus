name: Patch Favorite EPG Once

on:
  push:
    branches:
      - feature/favorites-epg-grid
    paths:
      - '.github/workflows/patch-favorite-epg-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feature/favorites-epg-grid

      - name: Patch favorite EPG reconciliation and guide anchor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          repo = Path('composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt')
          text = repo.read_text()

          old_fields = '''    private val epgScope = CoroutineScope(SupervisorJob() + Dispatchers.Default)\n    private var epgJob: Job? = null\n'''
          new_fields = old_fields + '''    private var activeEpgSourceUrl: String? = null\n    private var activeEpgUrls: List<String> = emptyList()\n'''
          assert old_fields in text and 'activeEpgSourceUrl' not in text
          text = text.replace(old_fields, new_fields, 1)

          old_toggle = '''    fun toggleFavorite(channel: LiveTvChannel) {\n        val favorites = mutableUiState.value.favoriteUrls.toMutableSet()\n        if (!favorites.add(channel.streamUrl)) {\n            favorites.remove(channel.streamUrl)\n        }\n        LiveTvStorage.saveFavoriteUrls(favorites)\n        mutableUiState.value = mutableUiState.value.copy(favoriteUrls = favorites)\n    }\n'''
          new_toggle = '''    fun toggleFavorite(channel: LiveTvChannel) {\n        val state = mutableUiState.value\n        val favorites = state.favoriteUrls.toMutableSet()\n        val wasAdded = favorites.add(channel.streamUrl)\n        if (!wasAdded) {\n            favorites.remove(channel.streamUrl)\n        }\n        LiveTvStorage.saveFavoriteUrls(favorites)\n\n        val nowEpochMs = LiveTvClock.nowEpochMs()\n        val favoriteTvgIds = state.channels\n            .asSequence()\n            .filter { candidate -> candidate.streamUrl in favorites }\n            .mapNotNull(LiveTvChannel::tvgId)\n            .map(String::trim)\n            .filter(String::isNotBlank)\n            .toSet()\n        val retainedProgrammes = state.programmesByChannel\n            .mapValues { (channelId, programmes) ->\n                if (channelId in favoriteTvgIds) {\n                    programmes\n                } else {\n                    programmes.filter { programme ->\n                        nowEpochMs in programme.startEpochMs until programme.stopEpochMs\n                    }\n                }\n            }\n            .filterValues(List<LiveTvProgramme>::isNotEmpty)\n\n        mutableUiState.value = state.copy(\n            favoriteUrls = favorites,\n            programmesByChannel = retainedProgrammes,\n        )\n\n        if (\n            wasAdded &&\n            !channel.tvgId.isNullOrBlank() &&\n            activeEpgUrls.isNotEmpty() &&\n            activeEpgSourceUrl == state.sourceUrl\n        ) {\n            mutableUiState.value = mutableUiState.value.copy(isEpgLoading = true)\n            loadEpgInBackground(state.sourceUrl, activeEpgUrls)\n        }\n    }\n'''
          assert old_toggle in text
          text = text.replace(old_toggle, new_toggle, 1)

          old_load = '''    private fun loadEpgInBackground(sourceUrl: String, epgUrls: List<String>) {\n        epgJob?.cancel()\n'''
          new_load = '''    private fun loadEpgInBackground(sourceUrl: String, epgUrls: List<String>) {\n        activeEpgSourceUrl = sourceUrl\n        activeEpgUrls = epgUrls\n        epgJob?.cancel()\n'''
          assert old_load in text
          text = text.replace(old_load, new_load, 1)
          repo.write_text(text)

          guide = Path('composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvGuide.kt')
          guide_text = guide.read_text()
          old_anchor = '''    var basePageStartEpochMs by remember(nowEpochMs) {\n        mutableStateOf(nowEpochMs.floorToGuideHour())\n    }\n'''
          new_anchor = '''    var basePageStartEpochMs by remember {\n        mutableStateOf(nowEpochMs.floorToGuideHour())\n    }\n'''
          assert old_anchor in guide_text
          guide.write_text(guide_text.replace(old_anchor, new_anchor, 1))
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvRepository.kt composeApp/src/commonMain/kotlin/com/nuvio/app/features/livetv/LiveTvGuide.kt
          git commit -m 'fix: reconcile EPG schedules with favorites'
          git push origin HEAD:feature/favorites-epg-grid
